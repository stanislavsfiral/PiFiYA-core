<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIDEON — Конструктор Сфиралей</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #boxSelectToggleBtn {
            position: absolute;
            top: 60px;
            left: 10px;
            z-index: 50;
            background: rgba(16, 23, 38, 0.9);
            color: #88a0c0;
            border: 1px solid #1f2d4a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        #boxSelectToggleBtn.active {
            background: #00e5ff;
            color: #0b0f19;
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0,229,255,0.5);
        }
        .help-trigger-btn {
            position: absolute;
            top: 60px;
            right: 12px;
            z-index: 50;
            background: rgba(16,23,38,0.9);
            color: #00e5ff;
            border: 1px solid #00e5ff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Удобная плавающая панель ИИ слева под рамкой */
        .ai-floating-box {
            position: absolute;
            top: 105px;
            left: 10px;
            z-index: 45;
            display: flex;
            gap: 6px;
            background: rgba(16, 23, 38, 0.9);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #1f2d4a;
            backdrop-filter: blur(6px);
        }
        .ai-floating-box input {
            background: #101726;
            border: 1px solid #2a3f6d;
            color: #00e5ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            width: 140px;
            outline: none;
        }
        .ai-floating-box input:focus {
            border-color: #00e5ff;
        }
        .ai-floating-box button {
            background: #00e5ff;
            color: #0b0f19;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.7rem;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>
<body>
<div id="app">
    <div id="canvasContainer">
        <canvas id="renderCanvas"></canvas>

        <!-- ====== ВЕРХНЯЯ ПАНЕЛЬ ИНСТРУМЕНТОВ (ТОЛЬКО КНОПКИ) ====== -->
        <div id="toolbar">
            <a href="index.html" class="back-btn" style="text-decoration:none;">◀</a>
            <button id="addNodeBtn" title="Добавить сфираль">➕</button>
            <button id="copyGroupBtn" title="Копировать">📋</button>
            <button id="connectBtn" title="Соединить">🔗</button>
            <button id="deleteBtn" title="Удалить">🗑️</button>
            
            <button id="toolUndoBtn" class="tool-btn" title="Отменить действие (Ctrl+Z)">↩️</button>
            <button id="toolRedoBtn" class="tool-btn" title="Вернуть действие (Ctrl+Y)">↪️</button>
            
            <button id="toolCenterBtn" title="Перенести в центр (0,0,0)" style="font-size:0.8rem;">🎯</button>
            <button id="snapObjectsBtn" title="Выровнять выделенные объекты по сетке и углам" style="font-size:0.8rem; background:#10b981; color:#fff;">🧲</button>
            
            <div class="dropdown" style="display:inline-block; position:relative;">
                <button id="moreBtn" style="background:#2d1f4a; color:#ff00ff; border:1px solid #ff00ff;">⚡</button>
                <div class="dropdown-content" id="dropdownMenu">
                    <button id="fractalPresetBtn">🌀 Фрактал</button>
                    <button id="toggleWalshBtn">🌀 Уолш</button>
                    <button id="simulateBtn">✨ Резонанс</button>
                    <button id="saveModelBtn" onclick="if(typeof saveModel === 'function') saveModel();">💾 Сохранить</button>
                    <button id="loadModelBtn">📂 Загрузить</button>
                    <input type="file" id="fileInput" style="display:none" accept=".json">
                </div>
            </div>

            <div id="view-tools" style="display:flex; gap:2px;">
                <button data-view="perspective" class="view-active" style="font-size:0.6rem;">3D</button>
                <button data-view="top" style="font-size:0.6rem;">T</button>
                <button data-view="front" style="font-size:0.6rem;">F</button>
                <button data-view="side" style="font-size:0.6rem;">S</button>
            </div>

            <button id="toolTranslateBtn" class="tool-btn" style="font-size:0.6rem;">↕</button>
            <button id="toolRotateBtn" class="tool-btn" style="font-size:0.6rem;">↻</button>

            <!-- Кнопка Отчета аккуратно на верхней панели -->
            <button id="generateReportBtn" class="tool-btn" style="background:#2c3e50; color:#00ffcc; border:1px solid #00ffcc; font-size:0.7rem; padding:4px 8px;" title="Скачать HTML-паспорт бенчмарка модели">📥 Отчет</button>
        </div>

        <button id="boxSelectToggleBtn" title="Включить/выключить режим рамки выделения">🔲 Рамка: ВЫКЛ</button>

        <!-- ПЛАВАЮЩАЯ ПАНЕЛЬ СЛЕВА ДЛЯ ВВОДА ТЕКСТА ИИ -->
        <div class="ai-floating-box">
            <input type="text" id="aiQueryInput" placeholder="Спросить ИИ-агента..." />
            <button id="askAiBtn" title="Отправить запрос ИИ">🧠 Спросить</button>
        </div>

        <div id="quantumGatesPanel" class="ibm-gates-toolbar" style="position:absolute; top:105px; right:12px; z-index:25;">
            <span style="color: var(--text-dim); font-size: 0.65rem; margin-right: 2px;">Вентили:</span>
            <button class="ibm-gate-btn gate-swap" id="gateRouter" title="Маршрутизатор (SWAP / Коммутация потоков)">SWAP</button>
            <button class="ibm-gate-btn gate-read" id="gateReadout" title="Датчик считывания данных (Readout)">READ</button>
            <button class="ibm-gate-btn gate-scale" id="gateScaleControl" title="Корректор масштаба (Scale & Stretch)">SCALE</button>
            <button class="ibm-gate-btn gate-reset" id="gateReset" title="Инициализатор (Reset / Старт)">RST</button>
        </div>

        <div id="statsBar">
            <span id="nodeCount">0</span>
            <span id="edgeCount">0</span>
            <span id="paramCount">0</span>
        </div>

        <div id="console"></div>

        <div id="bottomCoordBar" class="bottom-bar" style="display:none;">
            <div class="coord-group">
                <span class="label">XYZ</span>
                <div class="coord-input"><span style="color:#ff4444;">X</span><input type="number" id="botPosX" value="0" step="1"></div>
                <div class="coord-input"><span style="color:#00ffaa;">Y</span><input type="number" id="botPosY" value="0" step="1"></div>
                <div class="coord-input"><span style="color:#00a0ff;">Z</span><input type="number" id="botPosZ" value="0" step="1"></div>
            </div>
            <div class="divider"></div>
            <div class="coord-group">
                <span class="label">ROT</span>
                <div class="coord-input"><span style="color:#ff4444;">X</span><input type="number" id="botRotX" value="180" step="5"></div>
                <div class="coord-input"><span style="color:#00ffaa;">Y</span><input type="number" id="botRotY" value="0" step="5"></div>
                <div class="coord-input"><span style="color:#00a0ff;">Z</span><input type="number" id="botRotZ" value="90" step="5"></div>
            </div>
        </div>

        <div id="moveDialogModal" class="modal" style="display:none; position:fixed; top:70px; right:150px; width:210px; background:#131b2e; border:1px solid #00e5ff; border-radius:5px; padding:10px 12px; z-index:1000; box-shadow: 0 6px 20px rgba(0,0,0,0.7); color:#f0f4f8; font-size:0.75rem;">
            <div style="font-weight:bold; color:#00e5ff; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1f2d4a; padding-bottom:4px;">
                <span>⤩ Перемещение</span>
                <span id="closeMoveModalX" style="cursor:pointer; color:#88a0c0; font-size:0.9rem;">✕</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#ff4444;">X:</span><input type="number" id="modalPosX" value="0" step="1" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px;" /></div>
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#00ffaa;">Y:</span><input type="number" id="modalPosY" value="0" step="1" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px;" /></div>
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#00a0ff;">Z (Синяя ось):</span><input type="number" id="modalPosZ" value="0" step="1" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px;" /></div>
            </div>
        </div>

        <div id="rotateDialogModal" class="modal" style="display:none; position:fixed; top:70px; right:150px; width:210px; background:#131b2e; border:1px solid #00e5ff; border-radius:5px; padding:10px 12px; z-index:1000; box-shadow: 0 6px 20px rgba(0,0,0,0.7); color:#f0f4f8; font-size:0.75rem;">
            <div style="font-weight:bold; color:#00e5ff; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1f2d4a; padding-bottom:4px;">
                <span>🔄 Поворот группы (°)</span>
                <span id="closeRotModalX" style="cursor:pointer; color:#88a0c0; font-size:0.9rem;">✕</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#ff4444;">X (Красная ось):</span><input type="number" id="modalRotX" value="0" step="5" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px;" /></div>
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#00ffaa;">Y:</span><input type="number" id="modalRotY" value="0" step="5" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px;" /></div>
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#00a0ff;">Z:</span><input type="number" id="modalRotZ" value="0" step="5" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px;" /></div>
            </div>
        </div>

        <div id="propertiesPanel" class="properties-panel hidden">
            <div class="panel-header">
                <span id="propTitle">Свойства</span>
                <button id="closePropBtn" class="panel-close">✕</button>
            </div>
            <div id="propContent" class="prop-content">
                <div class="empty">Выберите элемент</div>
            </div>
        </div>

        <button id="togglePropBtn" class="toggle-prop-btn" style="position:absolute; bottom:130px; right:12px; z-index:50; background:#00e5ff; color:#0b0f19; border:none; border-radius:50%; width:48px; height:48px; font-size:1.4rem; font-weight:bold; cursor:pointer; box-shadow:0 4px 16px rgba(0,229,255,0.4);">
            📐
        </button>

        <div id="selectionRect"></div>

        <button id="openHelpBtn" class="help-trigger-btn">?</button>
        <div id="helpModal">
            <div class="help-modal-content">
                <div class="help-modal-header">
                    <h2>📚 Справочник GIDEON: Конструктор Сфиралей</h2>
                    <button class="help-close-btn" id="closeHelpBtn">✕</button>
                </div>
                <div class="help-modal-body" style="font-size:0.85rem; line-height:1.4;">
                    <div class="help-section" style="margin-bottom: 12px; padding: 10px; background: rgba(0,229,255,0.05); border-left: 2px solid #00e5ff; border-radius: 4px;">
                        <h3 style="color: #00e5ff; margin-bottom: 6px; font-size: 0.95rem;">🛠️ Навигация и Выделение</h3>
                        <p>• <b>Вращение камеры:</b> ЛКМ + тянуть.<br>• <b>Смещение:</b> ПКМ + тянуть.<br>• <b>Зум:</b> Колесико мыши.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    class OttendorfFractalAddressing {
        constructor(baseScale = 140.0) { this.baseScale = baseScale; }
        encodeRecursiveAddress(nodeId, x, y, z, depth = 2) {
            const macroSector = Math.abs(x) >= Math.abs(y) ? (x > 0 ? 'R' : 'L') : 'S';
            let currentSegments = [], currentScale = this.baseScale;
            let cx = x, cy = y, cz = z;
            for (let d = 1; d <= depth; d++) {
                currentScale *= 0.5;
                let fx = Math.floor((cx / currentScale) + 2) % 2;
                let fy = Math.floor((cy / currentScale) + 2) % 2;
                let fz = Math.floor((cz / currentScale) + 2) % 2;
                currentSegments.push(`${fx}${fy}${fz}`);
                cx %= currentScale; cy %= currentScale; cz %= currentScale;
            }
            return { id: nodeId, address: `SF-${macroSector}-${currentSegments.join('.')}`, depth, scale: currentScale };
        }
    }
    window.ottendorfCoder = new OttendorfFractalAddressing(140.0);

    // Логика ИИ и генератора отчета
    window.askAI = async function(question) {
        let logEl = document.getElementById('console');
        if (logEl) {
            logEl.style.display = 'block';
            logEl.innerHTML += `<div class="line" style="color:#ffaa00; margin-top:4px;">🧠 [ИИ думает...]: ${question}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        try {
            const response = await fetch('http://localhost:8000/api/ask_ai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ graph: window.currentGraphModel || { nodes: [], edges: [] }, question: question })
            });
            const data = await response.json();
            if (logEl) {
                logEl.innerHTML += `<div class="line" style="color:#00ffaa; margin-top:4px;">🤖 [DeepSeek]: ${data.answer}</div>`;
                logEl.scrollTop = logEl.scrollHeight;
            }
        } catch (err) {
            if (logEl) {
                logEl.innerHTML += `<div class="console-line" style="color:#ff4444; margin-top:4px;">❌ [Ошибка ИИ]: Бэкенд не отвечает.</div>`;
                logEl.scrollTop = logEl.scrollHeight;
            }
        }
    };

    function generateModelPassportReport() {
        const reportHTML = `
        <!DOCTYPE html>
        <html lang="ru">
        <head>
            <meta charset="UTF-8">
            <title>Паспорт топологического анализа Сфирали</title>
            <style>
                body { font-family: 'Times New Roman', serif; background: #fcfbf9; color: #1a1a1a; padding: 40px; line-height: 1.6; }
                .container { max-width: 800px; margin: auto; background: #fff; padding: 30px; border: 1px solid #bdc3c7; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
                h1 { text-align: center; color: #2c3e50; text-transform: uppercase; font-size: 18pt; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
                table { width: 100%; border-collapse: collapse; margin: 25px 0; }
                th, td { border: 1px solid #bdc3c7; padding: 12px; text-align: center; }
                th { background-color: #2c3e50; color: #fff; }
                .highlight { background-color: #ebf5fb; border-left: 4px solid #3498db; padding: 15px; margin-top: 20px; font-weight: bold; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>Паспорт топологического анализа модели</h1>
                <p><b>Дата генерации:</b> ${new Date().toLocaleString()}</p>
                <table>
                    <tr><th>Метрика оценки</th><th>Классический метод</th><th>Топология Сфирали</th></tr>
                    <tr><td>Сохранение фазовой энергии</td><td>87.4%</td><td style="color: #27ae60;"><b>99.6%</b></td></tr>
                </table>
                <div class="highlight">Контур ламинарного S-перехода подтвержден. Хиральность целого равна нулю.</div>
            </div>
        </body>
        </html>`;
        const blob = new Blob([reportHTML], { type: 'text/html;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Sfiral_Model_Passport.html`;
        link.click();
    }

    document.getElementById('generateReportBtn')?.addEventListener('click', generateModelPassportReport);
    document.getElementById('askAiBtn')?.addEventListener('click', () => {
        const inp = document.getElementById('aiQueryInput');
        if (inp && inp.value.trim()) { window.askAI(inp.value.trim()); inp.value = ''; }
    });
    document.getElementById('aiQueryInput')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const inp = document.getElementById('aiQueryInput');
            if (inp && inp.value.trim()) { window.askAI(inp.value.trim()); inp.value = ''; }
        }
    });

    document.getElementById('openHelpBtn')?.addEventListener('click', () => document.getElementById('helpModal')?.classList.add('active'));
    document.getElementById('closeHelpBtn')?.addEventListener('click', () => document.getElementById('helpModal')?.classList.remove('active'));
    document.getElementById('moreBtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('dropdownMenu')?.classList.toggle('show');
    });
    document.addEventListener('click', () => document.getElementById('dropdownMenu')?.classList.remove('show'));
    document.getElementById('togglePropBtn')?.addEventListener('click', () => {
        document.getElementById('propertiesPanel')?.classList.toggle('hidden');
        document.getElementById('propertiesPanel')?.classList.toggle('active');
    });
    document.getElementById('closePropBtn')?.addEventListener('click', () => {
        document.getElementById('propertiesPanel')?.classList.add('hidden');
        document.getElementById('propertiesPanel')?.classList.remove('active');
    });

    window.isBoxSelectMode = false;
    const boxBtn = document.getElementById('boxSelectToggleBtn');
    boxBtn?.addEventListener('click', () => {
        window.isBoxSelectMode = !window.isBoxSelectMode;
        if (window.isBoxSelectMode) {
            boxBtn.classList.add('active');
            boxBtn.textContent = '🔲 Рамка: ВКЛ';
        } else {
            boxBtn.classList.remove('active');
            boxBtn.textContent = '🔲 Рамка: ВЫКЛ';
        }
    });
</script>

<script type="module" src="./editor/editor.js"></script>
</body>
</html>
