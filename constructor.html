<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIDEON — Конструктор Сфиралей</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>
<body>
<div id="app">
    <div id="canvasContainer">
        <canvas id="renderCanvas"></canvas>

        <!-- ====== ПЛАВАЮЩАЯ ВЕРХНЯЯ ПАНЕЛЬ ====== -->
        <div id="toolbar">
            <a href="index.html" class="back-btn" style="text-decoration:none;">◀</a>
            <button id="addNodeBtn" title="Добавить сфираль">➕</button>
            <button id="copyGroupBtn" title="Копировать">📋</button>
            <button id="connectBtn" title="Соединить">🔗</button>
            <button id="deleteBtn" title="Удалить">🗑️</button>
            
            <!-- Выпадающее меню для расчётов -->
            <div class="dropdown" style="display:inline-block; position:relative;">
                <button id="moreBtn" style="background:#2d1f4a; color:#ff00ff; border:1px solid #ff00ff;">⚡</button>
                <div class="dropdown-content" id="dropdownMenu">
                    <button id="fractalPresetBtn">🌀 Фрактал</button>
                    <button id="toggleWalshBtn">🌀 Уолш</button>
                    <button id="simulateBtn">✨ Резонанс</button>
                    <button id="saveModelBtn">💾 Сохранить</button>
                    <button id="loadModelBtn">📂 Загрузить</button>
                    <input type="file" id="fileInput" style="display:none" accept=".json">
                </div>
            </div>

            <!-- Переключение видов -->
            <div id="view-tools" style="display:flex; gap:2px;">
                <button data-view="perspective" class="view-active" style="font-size:0.6rem;">3D</button>
                <button data-view="top" style="font-size:0.6rem;">T</button>
                <button data-view="front" style="font-size:0.6rem;">F</button>
                <button data-view="side" style="font-size:0.6rem;">S</button>
            </div>

            <!-- Режимы трансформации -->
            <button id="toolTranslateBtn" class="tool-btn" style="font-size:0.6rem;">↕</button>
            <button id="toolRotateBtn" class="tool-btn" style="font-size:0.6rem;">↻</button>
        </div>

        <!-- ====== СТАТИСТИКА (мини) ====== -->
        <div id="statsBar">
            <span id="nodeCount">0</span>
            <span id="edgeCount">0</span>
            <span id="paramCount">0</span>
        </div>

        <!-- ====== КОНСОЛЬ ====== -->
        <div id="console"></div>

        <!-- ====== НИЖНЯЯ ПАНЕЛЬ КООРДИНАТ ====== -->
        <div id="bottomCoordBar" class="bottom-bar" style="display:none;">
            <div class="coord-group">
                <span class="label">XYZ</span>
                <div class="coord-input"><span style="color:#ff4444;">X</span><input type="number" id="botPosX" value="0" step="1"></div>
                <div class="coord-input"><span style="color:#00ffaa;">Y</span><input type="number" id="botPosY" value="0" step="1"></div>
                <div class="coord-input"><span style="color:#00a0ff;">Z</span><input type="number" id="botPosZ" value="0" step="1"></div>
            </div>
            <div class="divider"></div>
            <div class="coord-group">
                <span class="label">ROT</span>
                <div class="coord-input"><span style="color:#ff4444;">X</span><input type="number" id="botRotX" value="180" step="5"></div>
                <div class="coord-input"><span style="color:#00ffaa;">Y</span><input type="number" id="botRotY" value="0" step="5"></div>
                <div class="coord-input"><span style="color:#00a0ff;">Z</span><input type="number" id="botRotZ" value="90" step="5"></div>
            </div>
        </div>

        <!-- ====== МОДАЛЬНОЕ ОКНО ПЕРЕМЕЩЕНИЯ (СБОКУ СВЕРХУ) ====== -->
        <div id="moveDialogModal" class="modal" style="display:none; position:fixed; top:70px; right:70px; width:210px; background:#131b2e; border:1px solid #00e5ff; border-radius:5px; padding:10px 12px; z-index:1000; box-shadow: 0 6px 20px rgba(0,0,0,0.7); color:#f0f4f8; font-size:0.75rem; cursor:move;">
            <div style="font-weight:bold; color:#00e5ff; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1f2d4a; padding-bottom:4px;">
                <span>⤩ Перемещение</span>
                <span id="closeMoveModalX" style="cursor:pointer; color:#88a0c0; font-size:0.9rem;">✕</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#ff4444;">X:</span><input type="number" id="modalPosX" value="0" step="1" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px; text-align:center; cursor:text;" /></div>
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#00ffaa;">Y:</span><input type="number" id="modalPosY" value="0" step="1" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px; text-align:center; cursor:text;" /></div>
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#00a0ff;">Z:</span><input type="number" id="modalPosZ" value="0" step="1" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px; text-align:center; cursor:text;" /></div>
            </div>
        </div>

        <!-- ====== МОДАЛЬНОЕ ОКНО ПОВОРОТА (СБОКУ СВЕРХУ) ====== -->
        <div id="rotateDialogModal" class="modal" style="display:none; position:fixed; top:70px; right:70px; width:210px; background:#131b2e; border:1px solid #00e5ff; border-radius:5px; padding:10px 12px; z-index:1000; box-shadow: 0 6px 20px rgba(0,0,0,0.7); color:#f0f4f8; font-size:0.75rem; cursor:move;">
            <div style="font-weight:bold; color:#00e5ff; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1f2d4a; padding-bottom:4px;">
                <span>🔄 Поворот группы (°)</span>
                <span id="closeRotModalX" style="cursor:pointer; color:#88a0c0; font-size:0.9rem;">✕</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#ff4444;">X:</span><input type="number" id="modalRotX" value="0" step="5" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px; text-align:center; cursor:text;" /></div>
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#00ffaa;">Y:</span><input type="number" id="modalRotY" value="0" step="5" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px; text-align:center; cursor:text;" /></div>
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="color:#00a0ff;">Z:</span><input type="number" id="modalRotZ" value="0" step="5" style="background:#1c2841; border:1px solid #2a3f6d; color:#fff; width:110px; padding:2px 4px; border-radius:3px; text-align:center; cursor:text;" /></div>
            </div>
        </div>

        <!-- ====== КОНТЕКСТНАЯ ПАНЕЛЬ СВОЙСТВ ====== -->
        <div id="propertiesPanel" class="properties-panel hidden">
            <div class="panel-header">
                <span id="propTitle">Свойства</span>
                <button id="closePropBtn" class="panel-close">✕</button>
            </div>
            <div id="propContent" class="prop-content">
                <div class="empty">Выберите элемент</div>
            </div>
        </div>

        <!-- ====== КНОПКА ОТКРЫТИЯ ПАНЕЛИ СВОЙСТВ ====== -->
        <button id="togglePropBtn" class="toggle-prop-btn" style="position:absolute; bottom:70px; right:10px; z-index:50; background:#00e5ff; color:#0b0f19; border:none; border-radius:50%; width:48px; height:48px; font-size:1.4rem; font-weight:bold; cursor:pointer; box-shadow:0 4px 16px rgba(0,229,255,0.4);">
            📐
        </button>

        <!-- ====== РАМКА ВЫДЕЛЕНИЯ ====== -->
        <div id="selectionRect"></div>

        <!-- ====== СПРАВКА ====== -->
        <button id="openHelpBtn" class="help-trigger-btn" style="position:absolute; top:10px; right:10px; z-index:50; background:rgba(16,23,38,0.9); color:#00e5ff; border:1px solid #00e5ff; border-radius:50%; width:36px; height:36px; font-size:1rem; cursor:pointer;">?</button>
        <div id="helpModal">
            <div class="help-modal-content">
                <div class="help-modal-header">
                    <h2>📚 Справка</h2>
                    <button class="help-close-btn" id="closeHelpBtn">✕</button>
                </div>
                <div class="help-modal-body">
                    <div class="help-section"><h3>Управление</h3><p><kbd>Ctrl+ПКМ</kbd> вращение · <kbd>Колёсико</kbd> масштаб · <kbd>1-4</kbd> виды</p></div>
                    <div class="help-section"><h3>Горячие клавиши</h3><p><kbd>Ctrl+Z</kbd> отмена · <kbd>Ctrl+C</kbd> копировать · <kbd>Ctrl+V</kbd> вставить · <kbd>Del</kbd> удалить</p></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('openHelpBtn').addEventListener('click', () => document.getElementById('helpModal').classList.add('active'));
    document.getElementById('closeHelpBtn').addEventListener('click', () => document.getElementById('helpModal').classList.remove('active'));
    document.getElementById('helpModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('helpModal')) document.getElementById('helpModal').classList.remove('active');
    });

    document.getElementById('moreBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('dropdownMenu').classList.toggle('show');
    });
    document.addEventListener('click', () => document.getElementById('dropdownMenu').classList.remove('show'));

    document.getElementById('togglePropBtn').addEventListener('click', () => {
        document.getElementById('propertiesPanel').classList.toggle('hidden');
        document.getElementById('propertiesPanel').classList.toggle('active');
    });
    document.getElementById('closePropBtn').addEventListener('click', () => {
        document.getElementById('propertiesPanel').classList.add('hidden');
        document.getElementById('propertiesPanel').classList.remove('active');
    });
</script>

<script type="module" src="./editor/editor.js"></script>
</body>
</html>
