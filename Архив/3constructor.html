<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GIDEON — Квантово-оптический терминал Сфирали[cite: 5]</title>
    <!-- Карта импорта Three.js для ES-модулей -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f0f4f8; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh;[cite: 5]}
        #app { display: flex; height: 100vh;[cite: 5]}
        #canvasContainer { flex: 1; position: relative; background: #0b0f19; overflow: hidden;[cite: 5]}
        #canvasContainer canvas { display: block; width: 100%; height: 100%;[cite: 5]}
        #toolbar { position: absolute; top: 10px; left: 10px; background: rgba(16,23,38,0.9); border: 1px solid #1f2d4a; border-radius: 8px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px; backdrop-filter: blur(4px); z-index: 10; pointer-events: none;[cite: 5]}
        #toolbar button, #toolbar select { pointer-events: auto; background: #1f2d4a; border: 1px solid #2a3f6d; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;[cite: 5]}
        #toolbar button:hover { background: #00e5ff; color: #0b0f19;[cite: 5]}
        #view-tools { display: flex; gap: 4px; border-left: 1px solid #2a3f6d; padding-left: 6px; margin-left: 4px;[cite: 5]}
        #view-tools button { background: #1f2d4a; border: 1px solid #2a3f6d; color: #88a0c0; padding: 2px 8px; font-size: 0.7rem;[cite: 5]}
        #view-tools button:hover { background: #00e5ff; color: #0b0f19;[cite: 5]}
        #view-tools .view-active { background: #00e5ff; color: #0b0f19; border-color: #00e5ff;[cite: 5]}
        #properties { width: 310px; background: #131b2e; border-left: 1px solid #1f2d4a; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.8rem;[cite: 5]}
        #properties h3 { color: #00e5ff; font-size: 0.9rem; border-bottom: 1px solid #1f2d4a; padding-bottom: 6px;[cite: 5]}
        .prop-group { display: flex; flex-direction: column; gap: 3px;[cite: 5]}
        .prop-group label { font-size: 0.7rem; color: #88a0c0;[cite: 5]}
        .prop-group input, .prop-group select { background: #1f2d4a; border: 1px solid #2a3f6d; color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; width: 100%;[cite: 5]}
        .prop-row { display: flex; gap: 6px; flex-wrap: wrap;[cite: 5]}
        .prop-row .prop-group { flex: 1;[cite: 5]}
        .empty { color: #88a0c0; font-style: italic; font-size: 0.75rem;[cite: 5]}
        #statsBar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(16,23,38,0.85); border: 1px solid #1f2d4a; border-radius: 6px; padding: 4px 14px; font-size: 0.7rem; color: #88a0c0; backdrop-filter: blur(4px); display: flex; gap: 20px; z-index: 10; pointer-events: none;[cite: 5]}
        #statsBar span { color: #00ffaa; font-weight: bold;[cite: 5]}
        #console { position: absolute; bottom: 50px; left: 20px; right: 20px; max-height: 180px; background: rgba(13,18,29,0.95); border: 1px solid #1f2d4a; border-radius: 6px; padding: 6px 12px; overflow-y: auto; font-family: monospace; font-size: 0.7rem; color: #00e5ff; z-index: 10; pointer-events: auto; backdrop-filter: blur(4px); display: none; user-select: text;[cite: 5]}
        #console .line { margin-bottom: 2px;[cite: 5]}
        #console .success { color: #00ffaa;[cite: 5]}
        #selectionRect { position: absolute; border: 1px dashed #00ffaa; background: rgba(0,255,170,0.1); pointer-events: none; display: none; z-index: 20;[cite: 5]}
        #progressBarContainer { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 360px; background: rgba(16,23,38,0.95); border: 1px solid #1f2d4a; border-radius: 6px; padding: 10px 14px; z-index: 20; display: none; backdrop-filter: blur(4px);[cite: 5]}
        #progressBarTrack { width: 100%; height: 6px; background: #1f2d4a; border-radius: 3px; overflow: hidden; margin-top: 6px;[cite: 5]}
        #progressBarFill { width: 0%; height: 100%; background: #00ffcc; transition: width 0.1s ease;[cite: 5]}
        #progressStatusText { font-size: 0.7rem; color: #00e5ff; display: flex; justify-content: space-between;[cite: 5]}
    </style>
</head>
<body>
<div id="app">
    <div id="canvasContainer">
        <canvas id="renderCanvas"></canvas>
        <div id="selectionRect"></div>
        <div id="progressBarContainer">
            <div id="progressStatusText">
                <span id="progressLabel">Фрактализация модели...[cite: 5]</span>
                <span id="progressTime">0 сек.[cite: 5]</span>
            </div>
            <div id="progressBarTrack">
                <div id="progressBarFill"></div>
            </div>
        </div>
        <div id="toolbar">
            <a href="index.html" style="text-decoration:none;"><button style="background:#00ffaa; color:#0b0f19; font-weight:bold;">◀ Назад</button></a>
            <button id="addNodeBtn">➕[cite: 5]</button>
            <button id="copyGroupBtn">📋 Копировать[cite: 5]</button>
            <button id="connectBtn">🔗 Соединить[cite: 5]</button>
            <button id="deleteBtn">🗑️ Удалить[cite: 5]</button>
            <button id="toggleWalshBtn" style="background:#2d1f4a; color:#ff00ff; border:1px solid #ff00ff; font-weight:bold;">🌀 Троичный Уолш (X,Y,Z)[cite: 5]</button>
            <button id="simulateBtn" style="background:#00e5ff; color:#0b0f19; font-weight:bold;">✨ Резонанс + Фурье[cite: 5]</button>
            <button id="exportPythonBtn" style="background:#ffaa00; color:#0b0f19; font-weight:bold;">🐍 Экспорт Python[cite: 5]</button>
            <button id="saveSpectrumBtn" style="background:#00ffcc; color:#0b0f19; font-weight:bold;">📊 Сохранить спектр[cite: 5]</button>
            <button id="saveModelBtn">💾 Сохранить[cite: 5]</button>
            <button id="loadModelBtn">📂 Загрузить[cite: 5]</button>
            <input type="file" id="fileInput" style="display:none" accept=".json">
            <select id="modeSelectEditor">
                <option value="Single">Single[cite: 5]</option>
                <option value="Axis X">Axis X[cite: 5]</option>
                <option value="Axis Y">Axis Y[cite: 5]</option>
                <option value="Axis Z">Axis Z[cite: 5]</option>
            </select>
            <span style="color:#88a0c0;font-size:0.6rem;">Shift+клик — выделение[cite: 5]</span>
            <div id="view-tools">
                <button data-view="perspective" class="view-active">Перспектива[cite: 5]</button>
                <button data-view="top">Сверху[cite: 5]</button>
                <button data-view="front">Спереди[cite: 5]</button>
                <button data-view="side">Сбоку[cite: 5]</button>
            </div>
        </div>
        <div id="statsBar">
            <span id="nodeCount">Узлов: 0[cite: 5]</span>
            <span id="edgeCount">Хроноквантов: 0[cite: 5]</span>
            <span id="paramCount">Параметров: 0[cite: 5]</span>
        </div>
        <div id="console"></div>
    </div>
    <div id="properties">
        <h3>📐 Свойства и Элементы[cite: 5]</h3>
        <div id="propContent" class="empty">Выберите узел или элемент[cite: 5]</div>
        <hr style="border-color:#1f2d4a; margin:6px 0;">
        <div class="prop-group">
            <label style="color:#00ffaa; font-weight:bold;">✨ Фрактализация по шаблону[cite: 5]</label>
            <div class="prop-row" style="margin-top:4px;">
                <div class="prop-group" style="flex:1;">
                    <label>Глубина (Level):[cite: 5]</label>
                    <input type="number" id="fractalDepthInput" value="3" min="1" max="6" step="1" />
                </div>
            </div>
            <button id="applyGlobalFractalBtn" style="margin-top:6px; background:#00ffcc; color:#0b0f19; border:none; padding:6px; border-radius:4px; cursor:pointer; font-weight:bold;">🚀 Запечь фрактальные диполи[cite: 5]</button>
        </div>
        <hr style="border-color:#1f2d4a; margin:6px 0;">
        <div class="prop-group">
            <label>Плавное сжатие выделенного (Шаг 1%)[cite: 5]</label>
            <div class="prop-row">
                <input type="number" id="scalePercentInput" value="99" min="1" max="100" step="1" style="width:70px;" />
                <button id="applyScalePercentBtn" style="background:#ffaa00;color:#0b0f19;border:none;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:0.7rem;font-weight:bold;">Сжать -1%[cite: 5]</button>
            </div>
        </div>
        <hr style="border-color:#1f2d4a; margin:6px 0;">
        <div class="prop-group">
            <label>Целевая позиция центра (XYZ)[cite: 5]</label>
            <div class="prop-row">
                <input type="number" id="groupMoveX" value="0" step="10" style="width:50px;" placeholder="X" />
                <input type="number" id="groupMoveY" value="0" step="10" style="width:50px;" placeholder="Y" />
                <input type="number" id="groupMoveZ" value="0" step="10" style="width:50px;" placeholder="Z" />
            </div>
            <button id="applyGroupMoveBtn" style="margin-top:2px;background:#00e5ff;color:#0b0f19;border:none;padding:3px;border-radius:4px;cursor:pointer;font-size:0.7rem;">Переместить в точку[cite: 5]</button>
        </div>
        <hr style="border-color:#1f2d4a; margin:6px 0;">
        <div class="prop-group">
            <label>Поворот группы °[cite: 5]</label>
            <div class="prop-row">
                <input type="number" id="groupRotX" value="0" step="5" style="width:60px;" />
                <input type="number" id="groupRotY" value="0" step="5" style="width:60px;" />
                <input type="number" id="groupRotZ" value="0" step="5" style="width:60px;" />
            </div>
            <button id="applyGroupRotBtn" style="margin-top:2px;background:#00e5ff;color:#0b0f19;border:none;padding:3px;border-radius:4px;cursor:pointer;font-size:0.7rem;">Применить[cite: 5]</button>
        </div>
    </div>
</div>

<!-- Подключаем модульный скрипт редактора -->
<script type="module" src="./editor/editor.js"></script>
</body>
</html>
